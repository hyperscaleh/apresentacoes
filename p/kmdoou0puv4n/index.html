<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent),T=D.theme,S=D.slides,I=D.icons;

var ai=function(n){return ' a" style="--i:'+n};

function cardsHtml(d){var cols=d.cols,h='<div class="grid" style="grid-template-columns:repeat('+cols+',1fr)">';d.cards.forEach(function(c,k){h+='<div class="card'+ai(k+1)+'"><div class="ico">'+I[c[2]]+'</div><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p></div>'});h+='</div>';if(d.footnote)h+='<div class="note a" style="--i:7">'+esc(d.footnote)+'</div>';return h}
var R={
cover:function(d){return '<div class="slide cover"><div class="brand"><span>INDICOSTAY</span><small>'+esc(d.sub.toUpperCase())+'</small></div><div class="kicker a" style="--i:0">'+esc(d.kicker)+'</div><h1 class="a" style="--i:1">'+esc(d.title)+'</h1><div class="sub a" style="--i:2">'+esc(d.sub)+'</div><div class="partner a" style="--i:3">'+esc(d.partner)+'</div><div class="cfoot">'+esc(d.foot)+'</div></div>'},
vision:function(d){return '<div class="slide"><h1 class="title">'+esc(d.title)+'</h1><div class="vis a" style="--i:1"><div class="k">Visão</div><h2>'+esc(d.vision)+'</h2></div><div class="mis a" style="--i:3"><div class="k">Missão</div><p>'+esc(d.mission)+'</p></div>'+foot()+'</div>'},
cards:function(d){return '<div class="slide"><h1 class="title">'+esc(d.title)+'</h1>'+cardsHtml(d)+foot()+'</div>'},
stats:function(d){var h='<div class="slide"><h1 class="title">'+esc(d.title)+'</h1><div class="lead">'+esc(d.lead)+'</div><div class="grid" style="grid-template-columns:repeat(4,1fr)">';d.stats.forEach(function(s,k){var big=s[1],m=big.match(/^([\d ]+)(.*)$/),num=m?m[1].replace(/ /g,''):'',suf=m?m[2]:'';h+='<div class="stat '+s[3]+ai(k+1)+'"><div class="tag"><span class="dot"></span>'+esc(s[0])+'</div><div class="big" data-n="'+num+'" data-s="'+esc(suf)+'">'+esc(big)+'</div><p>'+esc(s[2])+'</p></div>'});return h+'</div><div class="callout a" style="--i:6">'+esc(d.footnote)+'</div>'+foot()+'</div>'},
why:function(d){return '<div class="slide"><h1 class="title">'+esc(d.title)+'</h1><div class="quote a" style="--i:1">'+esc(d.quote)+'</div><div class="cl a" style="--i:2">'+esc(d.chipsLabel)+'</div><div class="chips a" style="--i:3">'+d.chips.map(function(c){return '<span class="chip">'+esc(c)+'</span>'}).join('')+'</div><div class="gives a" style="--i:4">'+d.gives.map(function(g){return '<div><b>'+esc(g[0])+'</b>'+esc(g[1])+'</div>'}).join('')+'</div>'+foot()+'</div>'},
journey:function(d){var h='<div class="slide"><h1 class="title">'+esc(d.title)+'</h1><div class="grid" style="grid-template-columns:repeat(5,1fr)">';d.steps.forEach(function(s,k){h+='<div class="step frag'+(k===3?' hl':'')+'"><div class="n">'+(k+1)+'</div><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p></div>'});return h+'</div><div class="callout frag">'+esc(d.note)+'</div>'+foot()+'</div>'},
pricing:function(d){var h='<div class="slide"><h1 class="title">'+esc(d.title)+'</h1><div class="lead">'+esc(d.lead)+'</div><div class="grid" style="grid-template-columns:repeat(3,1fr);align-items:center">';d.tiers.forEach(function(t,k){h+='<div class="tier'+(t.rec?' rec':'')+ai(k+1)+'">'+(t.rec?'<div class="badge">RECOMENDADO</div>':'')+'<h3>'+esc(t.name)+'</h3><div class="price">'+esc(t.price)+'</div><div class="unit">'+esc(t.unit)+'</div><ul>'+t.items.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul></div>'});return h+'</div><div class="note a" style="--i:5;font-style:normal;color:var(--muted);font-size:26px">'+esc(d.footnote)+'</div>'+foot()+'</div>'},
timeline:function(d){var h='<div class="slide"><h1 class="title">'+esc(d.title)+'</h1><div class="grid" style="grid-template-columns:repeat(3,1fr)">';d.phases.forEach(function(p,k){h+='<div class="phase'+ai(k+1)+'"><div class="p"><i></i>'+esc(p[0])+'</div><h3>'+esc(p[1])+'</h3><p>'+esc(p[2])+'</p></div>'});return h+'</div><div class="dec a" style="--i:4"><h3>'+esc(d.decisionsTitle)+'</h3><ul>'+d.decisions.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'+foot()+'</div>'},
twocol:function(d){return '<div class="slide"><h1 class="title">'+esc(d.title)+'</h1><div class="grid" style="grid-template-columns:1fr 1fr">'+[d.left,d.right].map(function(c,k){return '<div class="col'+(k?' r':'')+ai(k+1)+'"><h3>'+esc(c.h)+'</h3><ul>'+c.items.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul></div>'}).join('')+'</div><div class="band a" style="--i:3">'+esc(d.band)+'</div>'+foot()+'</div>'},
closing:function(d){var h='<div class="slide dark"><h1 class="title">'+esc(d.title)+'</h1><div class="grid" style="grid-template-columns:repeat(3,1fr)">';d.steps.forEach(function(s,k){h+='<div class="cstep'+ai(k+1)+'"><div class="n">'+(k+1)+'</div><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p></div>'});return h+'</div><div class="contact a" style="--i:5">'+esc(d.contact)+'</div>'+foot()+'</div>'}
};
stage.innerHTML=S.map(function(d){return R[d.type](d)}).join('');
var el=[].slice.call(stage.querySelectorAll('.slide')),cur=0,fi=0;
function title(d){return d.title||d.sub||''}
var dots=document.getElementById('dots');dots.innerHTML=S.map(function(_,k){return '<i data-k="'+k+'"></i>'}).join('');
var ov=document.getElementById('overview');ov.innerHTML=S.map(function(d,k){return '<div class="th" data-k="'+k+'"><small>'+(k+1)+'</small><b>'+esc(title(d))+'</b></div>'}).join('');
function counters(s){[].slice.call(s.querySelectorAll('.big[data-n]')).forEach(function(b){var n=+b.dataset.n,suf=b.dataset.s;if(!n){return}var t0=null,fmt=function(v){return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')};function f(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/1200),e=1-Math.pow(1-p,3);b.textContent=fmt(n*e)+suf;if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)})}
function frags(s){return [].slice.call(s.querySelectorAll('.frag'))}
function go(k,back){k=Math.max(0,Math.min(S.length-1,k));el.forEach(function(s,j){s.classList.toggle('active',j===k);s.classList.toggle('past',j<k)});
 var s=el[k];frags(s).forEach(function(f){f.classList.toggle('on',!!back)});fi=back?frags(s).length:0;cur=k;
 s.querySelectorAll('.a').forEach(function(a){a.style.animation='none';a.offsetHeight;a.style.animation=''});counters(s);
 document.getElementById('bar').style.width=((k+1)/S.length*100)+'%';document.getElementById('count').textContent=(k+1)+' / '+S.length;
 [].forEach.call(dots.children,function(d,j){d.classList.toggle('on',j===k)});[].forEach.call(ov.children,function(d,j){d.classList.toggle('cur',j===k)});
 document.getElementById('notetext').textContent=S[k].notes||'';history.replaceState(null,'','#'+(k+1))}
function next(){var f=frags(el[cur]);if(fi<f.length){f[fi].classList.add('on');fi++;return}go(cur+1)}
function prev(){var f=frags(el[cur]);if(fi>0){fi--;f[fi].classList.remove('on');return}go(cur-1,true)}
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',fit);fit();
document.addEventListener('keydown',function(e){var k=e.key;if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();next()}else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev()}else if(k==='Home')go(0);else if(k==='End')go(S.length-1);else if(k==='f'||k==='F')fs();else if(k==='o'||k==='O')ov.classList.toggle('show');else if(k==='n'||k==='N')document.getElementById('notes').classList.toggle('show');else if(k==='Escape')ov.classList.remove('show')});
function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen()}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('fs').onclick=fs;
document.getElementById('ov').onclick=function(){ov.classList.toggle('show')};document.getElementById('nt').onclick=function(){document.getElementById('notes').classList.toggle('show')};
